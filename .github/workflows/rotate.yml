name: Rotate password and deploy

# Every day at 07:00 UTC (midnight in Edmonton, 1 AM in summer): re-encrypt
# the snapshot under that day's password and redeploy, so yesterday's
# password stops working. Nothing secret is printed: this repo's logs are public.
on:
  schedule:
    - cron: "0 7 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/seal.mjs build _site
        env:
          SHARE_SECRET: ${{ secrets.SHARE_SECRET }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
